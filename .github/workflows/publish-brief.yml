name: Research and publish discovery brief

# Production route: GitHub schedules the daily run itself. The repository
# collects primary release evidence, Gemini analyses and drafts the JSON, then
# the site's own validator and fixed renderer guard publication. A research
# issue remains available as an explicit operator-triggered run.
#
# Recovery route: paste JSON into "brief: <date>". It skips Gemini and enters
# the same validation/render/publication path.
#
# The render runs in this job rather than in a workflow of its own, because a
# commit made with GITHUB_TOKEN does not trigger other workflows — a separate
# render workflow would simply never fire.

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    # 05:37 UTC is 11:07 IST. Avoid :00, when GitHub's scheduled queue is
    # busiest. The watchdog checks later and alerts Telegram if this is late.
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional publication date (YYYY-MM-DD); defaults to today in IST"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: dockfinity-daily-publish
  cancel-in-progress: false

env:
  # Pinned. A different release of either face changes the metrics, which
  # changes where the text wraps, which changes the layout. Both were verified
  # against the figures the scheduled task produced for the same brief.
  INTER_VERSION: "4.1"
  SYNE_COMMIT: "54fb97bd69162b95b2aa2c3996ffd71466c1aec2"
  PILLOW_VERSION: "12.1.1"
  SLIDE_RENDERER_COMMIT: "f2e32a3b4a3f61e698e7d6deddfe350b473c19dd"
  LOGO_URL: "https://raw.githubusercontent.com/jain13abhi/slide-renderers/f2e32a3b4a3f61e698e7d6deddfe350b473c19dd/assets/dockfinity/logo-colour.png"

jobs:
  publish:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      ((startsWith(github.event.issue.title, 'research:') && github.event.action == 'opened') ||
      startsWith(github.event.issue.title, 'brief:'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the run and skip an already-published date
        id: preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            TITLE="$ISSUE_TITLE"
            DATE="${TITLE##*: }"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            DATE="${REQUESTED_DATE:-$(TZ=Asia/Kolkata date +%F)}"
            if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Date must be YYYY-MM-DD, got: $DATE" >&2
              exit 1
            fi
            TITLE="research: ${DATE}"
            if [ -f "content/discovery/${DATE}.json" ]; then
              echo "${DATE} is already published; no Gemini call is needed."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "research_title=$TITLE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.preflight.outputs.skip != 'true'
        run: npm ci

      - uses: actions/setup-python@v5
        if: steps.preflight.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install the locked renderer dependencies
        if: steps.preflight.outputs.skip != 'true'
        run: |
          pip install "Pillow==${PILLOW_VERSION}"
          mkdir -p ~/.fonts .renderer
          curl -fsSL -o inter.zip \
            "https://github.com/rsms/inter/releases/download/v${INTER_VERSION}/Inter-${INTER_VERSION}.zip"
          unzip -j -o inter.zip 'extras/otf/*.otf' -d ~/.fonts
          curl -fsSL -o "$HOME/.fonts/Syne[wght].ttf" \
            "https://raw.githubusercontent.com/google/fonts/${SYNE_COMMIT}/ofl/syne/Syne%5Bwght%5D.ttf"
          curl -fsSL -o .renderer/dockfinity.py \
            "https://raw.githubusercontent.com/jain13abhi/slide-renderers/${SLIDE_RENDERER_COMMIT}/dockfinity/render-slides.py"
          curl -fsSL -o logo.png "$LOGO_URL"

      - name: Research and draft with Gemini
        if: >-
          steps.preflight.outputs.skip != 'true' &&
          (github.event_name != 'issues' || startsWith(github.event.issue.title, 'research:'))
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          RESEARCH_TITLE: ${{ steps.preflight.outputs.research_title }}
          DOCKFINITY_RENDERER: .renderer/dockfinity.py
          DOCKFINITY_LOGO: logo.png
        run: |
          set -o pipefail
          npx --no-install tsx scripts/research-brief.mjs --out generated-brief.json \
            2>error.txt | tee research.txt

      - name: Validate and write the brief
        if: steps.preflight.outputs.skip != 'true'
        id: publish
        env:
          BRIEF_BODY: ${{ github.event.issue.body }}
          BRIEF_FILE: ${{ (github.event_name != 'issues' || startsWith(github.event.issue.title, 'research:')) && 'generated-brief.json' || '' }}
        run: |
          set -o pipefail
          npx --no-install tsx scripts/publish-brief.mjs 2>error.txt | tee result.txt

      - name: Read what was written
        if: steps.preflight.outputs.skip != 'true'
        id: meta
        run: |
          for key in file date title action; do
            echo "$key=$(grep "^$key=" result.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          done

      - name: Render the slide
        if: steps.preflight.outputs.skip != 'true'
        run: |
          set -o pipefail
          python scripts/render-brief.py "${{ steps.meta.outputs.date }}" \
            --renderer .renderer/dockfinity.py \
            --logo logo.png --out-dir public/briefs 2>>error.txt | tee -a render.txt

      - name: Commit
        if: steps.preflight.outputs.skip != 'true'
        id: commit
        env:
          FILE: ${{ steps.meta.outputs.file }}
          DATE: ${{ steps.meta.outputs.date }}
          TITLE: ${{ steps.meta.outputs.title }}
          ACTION: ${{ steps.meta.outputs.action }}
          SOURCE_EVENT: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          slide="public/briefs/dockfinity-discovery-${DATE}.png"

          if git diff --quiet -- "$FILE" && git diff --quiet -- "$slide" \
             && [ -z "$(git ls-files --others --exclude-standard -- "$slide")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$SOURCE_EVENT" = "issues" ]; then
            SOURCE="issue #${ISSUE_NUMBER}"
          else
            SOURCE="${SOURCE_EVENT} run"
          fi
          git add "$FILE" "$slide"
          git commit -m "content(${ACTION}): discovery brief ${DATE}

          ${TITLE}

          Published from ${SOURCE}."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Send the slides and captions to Telegram
        if: steps.preflight.outputs.skip != 'true' && steps.commit.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          node scripts/notify-telegram.mjs \
            --brief "content/discovery/${DATE}.json" \
            --slides "public/briefs/dockfinity-discovery-${DATE}.png" \
            --label "Dockfinity" \
            --url "https://dockfinity.com/discovery/${DATE}"

      - name: Comment and close
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          FILE: ${{ steps.meta.outputs.file }}
          DATE: ${{ steps.meta.outputs.date }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        with:
          script: |
            const fs = require('fs');
            const { FILE, DATE, CHANGED } = process.env;

            let figures = '';
            try { figures = fs.readFileSync('render.txt', 'utf-8').trim(); } catch {}

            const body = CHANGED === 'true'
              ? [
                  `Published **${DATE}** to \`${FILE}\`, with the slide.`,
                  '',
                  'The site rebuilds automatically. It will appear at ' +
                  `[/discovery](https://dockfinity.com/discovery) and at ` +
                  `[/discovery/${DATE}](https://dockfinity.com/discovery/${DATE}) within a few minutes.`,
                  '',
                  figures ? '```\n' + figures + '\n```' : '',
                ].join('\n')
              : `**${DATE}** is already published and identical to what you pasted. Nothing was committed.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Say on Telegram that it was refused
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event_name == 'issues' && github.event.issue.title || steps.preflight.outputs.research_title }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram is not configured; the issue comment is the only record."
            exit 0
          fi

          DETAIL=$(tail -c 1200 error.txt 2>/dev/null)
          [ -n "$DETAIL" ] || DETAIL="It failed before the brief could be checked. See the run log."

          LINK=""
          if [ -n "$ISSUE" ]; then
            LINK="https://github.com/${GITHUB_REPOSITORY}/issues/${ISSUE}"
          fi

          MSG=$(printf '%s\n' \
            "Dockfinity — not published." \
            "" \
            "${TITLE}" \
            "" \
            "$DETAIL" \
            "" \
            "Nothing was committed and the site is unchanged." \
            "$LINK")

          curl -sS -o /dev/null -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true"

      - name: Print the failure diagnostic in the run log
        if: failure()
        run: |
          echo "::error::Dockfinity publication failed; the exact diagnostic follows."
          if [ -s error.txt ]; then
            tail -c 4000 error.txt
          else
            echo "No diagnostic file was produced. Inspect the first failed step above."
          fi

      - name: Report the failure on the issue
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let detail = '';
            try { detail = fs.readFileSync('error.txt', 'utf-8').trim(); } catch {}
            if (!detail) detail = 'The workflow failed before the brief could be checked. See the run log.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'This brief was **not** published. Nothing was committed and the site is unchanged.',
                '',
                '```',
                detail,
                '```',
                '',
                context.payload.issue.title.startsWith('research:')
                  ? 'Editing this issue will not spend API quota again. Use a validated `brief:` recovery issue, or explicitly open a new research issue only after checking quota.'
                  : 'Fix the JSON and edit this issue — the check runs again on every edit.',
              ].join('\n'),
            });
