name: Publish discovery brief

# Paste the day's section 7 JSON into an issue titled "brief: <date>".
# This validates it with the site's own validator and commits it to
# content/discovery/. A bad brief is reported on the issue and never lands.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: startsWith(github.event.issue.title, 'brief:')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and write the brief
        id: publish
        env:
          BRIEF_BODY: ${{ github.event.issue.body }}
        run: |
          set -o pipefail
          npx --yes tsx scripts/publish-brief.mjs 2>error.txt | tee result.txt

      - name: Commit
        id: commit
        run: |
          file=$(grep '^file=' result.txt | cut -d= -f2-)
          date=$(grep '^date=' result.txt | cut -d= -f2-)
          title=$(grep '^title=' result.txt | cut -d= -f2-)
          action=$(grep '^action=' result.txt | cut -d= -f2-)

          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

          if git diff --quiet -- "$file"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "content($action): discovery brief $date

          $title

          Published from issue #${{ github.event.issue.number }}."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Comment and close
        if: success()
        uses: actions/github-script@v7
        env:
          FILE: ${{ steps.commit.outputs.file }}
          DATE: ${{ steps.commit.outputs.date }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        with:
          script: |
            const { FILE, DATE, CHANGED } = process.env;
            const body = CHANGED === 'true'
              ? `Published **${DATE}** to \`${FILE}\`.\n\nThe site rebuilds automatically. It will appear at [/discovery](https://dockfinity.com/discovery) and at [/discovery/${DATE}](https://dockfinity.com/discovery/${DATE}) within a few minutes.`
              : `**${DATE}** is already published and identical to what you pasted. Nothing was committed.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Report the failure on the issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let detail = '';
            try { detail = fs.readFileSync('error.txt', 'utf-8').trim(); } catch {}
            if (!detail) detail = 'The workflow failed before the brief could be checked. See the run log.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'This brief was **not** published. Nothing was committed and the site is unchanged.',
                '',
                '```',
                detail,
                '```',
                '',
                'Fix the JSON and edit this issue — the check runs again on every edit.',
              ].join('\n'),
            });
