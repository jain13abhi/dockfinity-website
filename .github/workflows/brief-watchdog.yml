name: Did today's brief arrive

# Metal Dock went quiet on 10 September and nobody noticed for six days. The
# task had stopped, the bridge had never once run, and nothing anywhere said
# so. The first sign was somebody going to look.
#
# This looks instead. It runs after both morning runs have had time to land,
# checks whether today's file is in the repository, and says so on Telegram
# when it is not. A quiet morning now produces a message rather than silence.

on:
  schedule:
    # 06:43 UTC is 12:13 IST, an hour and a bit after the later morning run.
    #
    # Deliberately not on the hour. A scheduled workflow is best effort and
    # GitHub delays the ones queued at :00 the most - on 17 September this
    # fired at 12:30 UTC against a 07:00 cron, five and a half hours late, so
    # the alarm arrived at six in the evening.
    #
    # Even off the hour this is approximate. This is the independent backstop
    # for the native publish schedule in publish-brief.yml.
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for today's brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # IST, because that is the timezone the tasks are scheduled in and
          # the date the brief is filed under.
          DATE=$(TZ=Asia/Kolkata date +%F)
          FILE="content/discovery/${DATE}.json"

          if [ -f "$FILE" ]; then
            echo "Found $FILE"
            exit 0
          fi

          echo "No brief for ${DATE}."

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram is not configured, so nobody was told."
            exit 1
          fi

          MSG=$(printf '%s\n' \
            "Dockfinity — no brief for ${DATE}." \
            "" \
            "Nothing reached the site this morning. Check, in this order:" \
            "" \
            "1. Did 'Research and publish discovery brief' run near 11:07 IST?" \
            "2. Did its log report Gemini, evidence, validation or render failure?" \
            "3. If no run exists, launch that workflow manually for ${DATE}." \
            "" \
            "Whichever of those is empty is where it stopped.")

          # --data-urlencode so newlines and ampersands in the text cannot
          # break the request or truncate the message.
          curl -sS -o /dev/null -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"

          # Fails on purpose: the run also shows red in Actions, so a missing
          # brief is visible in two places rather than one.
          exit 1
